<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVENZO - User Sign in</title>
    <meta name="description" content="INVENZO: Inventory and billing system for retail stores.">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: var(--surface);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: var(--surface);
            border-radius: var(--radius-panel);
            box-shadow: var(--raised);
            border: 1px solid var(--border);
            padding: 2.25rem 2rem;
            margin-bottom: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .login-logo {
            width: 48px;
            height: 48px;
            background-color: var(--surface);
            border-radius: var(--radius-control);
            box-shadow: var(--raised-sm);
            border: 1px solid var(--border);
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .language-picker-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .language-picker {
            min-height: 36px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8125rem;
            border-radius: var(--radius-control);
            background-color: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--inset);
            color: var(--text);
        }

        .password-wrap {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            padding: 0.25rem;
        }

        .login-error {
            background-color: var(--surface);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: var(--radius-control);
            padding: 0.75rem;
            font-size: 0.8125rem;
            margin-bottom: 1rem;
            display: none;
        }

        .login-footer-links {
            display: flex;
            gap: 1.25rem;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .login-footer-links a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="login-card" role="main">
        <header class="login-header">
            <div class="login-logo" aria-hidden="true">
                <!-- Lucide Boxes SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/>
                    <path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/>
                    <path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/>
                    <path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/>
                    <path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/>
                    <path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/>
                </svg>
            </div>
            <h1 class="login-title">INVENZO</h1>
            <p class="login-subtitle" id="loginSubtitle">Inventory management</p>
        </header>

        <div class="language-picker-wrap">
            <select class="language-picker" id="langSelect" aria-label="Select language">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="mr">मराठी (Marathi)</option>
            </select>
        </div>

        <div class="login-error" id="loginError" role="alert"></div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label class="form-label" for="username" id="lblUsername">Username</label>
                <input class="form-input" type="text" id="username" name="username" required autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password" id="lblPassword">Password</label>
                <div class="password-wrap">
                    <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="pwdToggle" aria-label="Show password">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="btnSubmit" style="width: 100%; margin-top: 0.5rem;">
                Sign in
            </button>
        </form>
    </main>

    <footer class="login-footer-links">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms and Conditions</a>
    </footer>

    <script>
        const langSelect = document.getElementById('langSelect');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const pwdToggle = document.getElementById('pwdToggle');
        const passwordInput = document.getElementById('password');

        // Translations mapping for login
        const translations = {
            en: {
                subtitle: 'Inventory management',
                user: 'Username',
                pass: 'Password',
                btn: 'Sign in',
                err_generic: 'Invalid username or password.',
                err_suspended: 'This store account is suspended. Contact the application provider.'
            },
            hi: {
                subtitle: 'इन्वेंट्री प्रबंधन',
                user: 'उपयोगकर्ता नाम (Username)',
                pass: 'पासवर्ड (Password)',
                btn: 'साइन इन करें',
                err_generic: 'अमान्य उपयोगकर्ता नाम या पासवर्ड।',
                err_suspended: 'यह दुकान खाता निलंबित है। कृपया प्रदाता से संपर्क करें।'
            },
            mr: {
                subtitle: 'इन्व्हेंटरी व्यवस्थापन',
                user: 'वापरकर्ता नाव (Username)',
                pass: 'पासवर्ड (Password)',
                btn: 'साइन इन करा',
                err_generic: 'अवैध वापरकर्ता नाव किंवा पासवर्ड.',
                err_suspended: 'हे दुकान खाते निलंबित केले आहे. कृपया प्रदात्याशी संपर्क साधा.'
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('stocker_lang', lang);
            document.documentElement.lang = lang;
            const t = translations[lang] || translations.en;
            document.getElementById('loginSubtitle').textContent = t.subtitle;
            document.getElementById('lblUsername').textContent = t.user;
            document.getElementById('lblPassword').textContent = t.pass;
            document.getElementById('btnSubmit').textContent = t.btn;
        }

        const savedLang = localStorage.getItem('stocker_lang') || 'en';
        langSelect.value = savedLang;
        setLanguage(savedLang);

        langSelect.addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        // Toggle password visibility
        pwdToggle.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        });

        // Submit form
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const currentLang = langSelect.value;
            const t = translations[currentLang] || translations.en;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    if (data.error && data.error.code === 'STORE_SUSPENDED') {
                        loginError.textContent = t.err_suspended;
                    } else {
                        loginError.textContent = t.err_generic;
                    }
                    loginError.style.display = 'block';
                    return;
                }

                if (data.success) {
                    window.location.href = '/app';
                }
            } catch (err) {
                loginError.textContent = 'Connection error. Please try again.';
                loginError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
